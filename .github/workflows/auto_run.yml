name: 自動更新成績看板

on:
  schedule:
    # 每天台灣時間 18:00 自動執行一次 (UTC 10:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # 支援在網頁上隨時手動點擊按鈕執行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - name: 1. 抓取專案檔案
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl

      - name: 4. 執行成績計算程式
        run: python _Champion.py

      - name: 5. 自動將產生的網頁同步至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto Update Score HTML Report" || exit 0
          git push
